name: Análisis automático del portafolio
on:
  schedule:
    - cron: "30 2,13 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: noticiero-automatic-finance
  cancel-in-progress: false
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: saulwade/noticiero
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-finance.txt
      - name: Calcular y guardar análisis privado
        run: node --import tsx scripts/automatic-finance.ts
        env:
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET }}
          FINANCE_PYTHON: python
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
      - name: Comprobar salud y avisar si es necesario
        if: always()
        run: node scripts/notify-ops.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_MONITOR_SECRET: ${{ secrets.OPS_MONITOR_SECRET }}
