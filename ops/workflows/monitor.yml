name: Comprobar ediciones y respaldos
on:
  schedule:
    - cron: "37 15 * * *"
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Probar un aviso privado y marcar este ensayo como fallido
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: noticiero-operations
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: saulwade/noticiero
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/notify-ops.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_MONITOR_SECRET: ${{ secrets.OPS_MONITOR_SECRET }}
          OPS_TEST_ALERT: ${{ inputs.test_alert && 'true' || 'false' }}
