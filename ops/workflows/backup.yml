name: Respaldo diario cifrado
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: noticiero-operations
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: saulwade/noticiero
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Crear snapshot cifrado
        id: backup
        run: node --import tsx scripts/backup.ts
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: noticiero-backup-${{ github.run_id }}
          path: .data/backups/cloud-latest.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Registrar el resultado en Noticiero
        id: report
        if: always() && steps.checkout.outcome == 'success'
        run: node scripts/report-backup.mjs
        env:
          BACKUP_STATUS: ${{ steps.backup.outcome == 'success' && steps.upload.outcome == 'success' && 'completed' || 'failed' }}
          OPS_REPORT_SECRET: ${{ secrets.OPS_REPORT_SECRET }}
      - name: Comprobar salud y avisar si es necesario
        if: always() && steps.checkout.outcome == 'success'
        run: node scripts/notify-ops.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPS_MONITOR_SECRET: ${{ secrets.OPS_MONITOR_SECRET }}
          BACKUP_STATUS: ${{ steps.backup.outcome == 'success' && steps.upload.outcome == 'success' && steps.report.outcome == 'success' && 'completed' || 'failed' }}
